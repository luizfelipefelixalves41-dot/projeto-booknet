[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s
path_separator = os

# A conexão online vem de backend.database.engine. Não colocar credenciais aqui.
# O modo offline usa apenas o dialeto PostgreSQL e não carrega o arquivo .env.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

