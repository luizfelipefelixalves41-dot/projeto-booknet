# V4: o BookNet inteiro em contêineres.
#
#   docker compose up --build        sobe tudo (Ctrl+C encerra)
#   docker compose up --build -d     sobe em segundo plano
#   docker compose stop emprestimos  derruba um serviço (falha 1)
#   docker compose kill emprestimos  simula uma queda: o Docker o reinicia (V5)
#   docker compose down              remove os contêineres
#
# Cliente Web: http://localhost:8080
#
# Dentro da rede do compose, cada contêiner é encontrado pelo NOME do serviço:
# o Serviço de Empréstimos chama http://catalogo:8001 e http://usuarios:8002,
# e não mais 127.0.0.1. O banco continua sendo o PostgreSQL no Neon.

name: booknet

x-servico: &servico
  build: .
  image: booknet-servicos:v6
  # V5: se o processo cair (erro, falta de memória), o Docker o inicia de novo sozinho.
  restart: unless-stopped
  env_file: .env # DATABASE_URL e BOOKNET_TOKEN_INTERNO (o .env não entra na imagem)
  environment: &ambiente
    BOOKNET_ORIGENS_EXTRAS: ${BOOKNET_ORIGENS_EXTRAS:-} # origens além de localhost e da rede local
  depends_on:
    migracao:
      condition: service_completed_successfully

services:
  # Roda uma vez, antes dos serviços: aplica as migrations pendentes e termina.
  migracao:
    build: .
    image: booknet-servicos:v6
    env_file: .env
    command: ["python", "-m", "alembic", "upgrade", "head"]

  catalogo:
    <<: *servico
    command: ["python", "-m", "uvicorn", "backend.servicos.catalogo:app", "--host", "0.0.0.0", "--port", "8001"]
    ports: ["8001:8001"]

  usuarios:
    <<: *servico
    command: ["python", "-m", "uvicorn", "backend.servicos.usuarios:app", "--host", "0.0.0.0", "--port", "8002"]
    ports: ["8002:8002"]

  emprestimos:
    <<: *servico
    command: ["python", "-m", "uvicorn", "backend.servicos.emprestimos:app", "--host", "0.0.0.0", "--port", "8003"]
    ports: ["8003:8003"]
    environment:
      <<: *ambiente
      BOOKNET_URL_CATALOGO: http://catalogo:8001
      BOOKNET_URL_USUARIOS: http://usuarios:8002

  cliente:
    build: ./cliente
    image: booknet-cliente:v6
    restart: unless-stopped
    ports: ["8080:80"]
    depends_on: [catalogo, usuarios, emprestimos]
